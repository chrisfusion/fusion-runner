[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-runner-helpers"
version = "0.1.0"
description = "Runtime helper libraries for code running under fusion-runner (auth, and future helpers)."
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
